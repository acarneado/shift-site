<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    /* Dégradé diagonal sobre entre les deux verts de marque, plus une touche
       chaude en coin haut-droit (accent-soft) pour éviter l'aplat trop plat. */
    background:
      radial-gradient(circle at 92% -6%, oklch(0.72 0.08 70 / 0.16) 0%, transparent 42%),
      linear-gradient(135deg, oklch(0.22 0.05 155) 0%, oklch(0.28 0.06 155) 55%, oklch(0.30 0.06 155) 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Liseré fin, pleine bordure, pour un rendu plus "carte" qu'aplat brut */
  .frame {
    position: absolute;
    inset: 22px;
    border: 1px solid oklch(0.97 0.008 60 / 0.14);
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <!-- Symbole de marque seul : le titre/description du partage porte déjà
       le nom et l'accroche, l'image n'a plus besoin de les répéter.
       Géométrie identique à components/ShiftLogo.js (variante "reversed"). -->
  <svg width="260" height="260" viewBox="0 0 100 100">
    <path
      d="M24 74 C46 74 54 56 64 40 C72 27 84 21 100 19"
      fill="none"
      stroke="oklch(0.97 0.008 60)"
      stroke-width="9"
      stroke-linecap="butt"
    />
    <circle cx="24" cy="74" r="8.5" fill="oklch(0.72 0.11 40)" />
  </svg>
</body>
</html>
