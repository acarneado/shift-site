<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    /* Dégradé diagonal sobre entre les deux verts de marque, plus une touche
       chaude en coin haut-droit (accent-soft) pour éviter l'aplat trop plat. */
    background:
      radial-gradient(circle at 92% -6%, oklch(0.72 0.08 70 / 0.16) 0%, transparent 42%),
      linear-gradient(135deg, oklch(0.22 0.05 155) 0%, oklch(0.28 0.06 155) 55%, oklch(0.30 0.06 155) 100%);
    font-family: "IBM Plex Sans", sans-serif;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 84px 100px;
  }

  /* Liseré fin, pleine bordure, pour un rendu plus "carte" qu'aplat brut */
  .frame {
    position: absolute;
    inset: 22px;
    border: 1px solid oklch(0.97 0.008 60 / 0.14);
    border-radius: 4px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    align-self: flex-start;
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: oklch(0.5 0.13 70);
    background: oklch(0.5 0.13 70 / 0.16);
    border-radius: 999px;
    padding: 7px 18px;
    margin-bottom: 30px;
  }

  .wordmark {
    font-family: "Lora", serif;
    font-weight: 600;
    font-size: 72px;
    letter-spacing: 0.01em;
    color: oklch(0.97 0.008 60);
    line-height: 1;
    margin-bottom: 24px;
  }

  .tagline {
    font-family: "Lora", serif;
    font-weight: 500;
    font-style: italic;
    font-size: 30px;
    line-height: 1.4;
    color: oklch(0.94 0.008 60);
    max-width: 780px;
    margin-bottom: 40px;
  }

  .rule {
    width: 44px;
    height: 2px;
    border-radius: 999px;
    background: oklch(0.62 0.10 40);
    margin-bottom: 22px;
  }

  .byline {
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 23px;
    color: oklch(0.88 0.015 60);
  }

  .byline b {
    font-weight: 500;
    color: oklch(0.98 0.006 60);
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <p class="eyebrow" id="eyebrow">__LABEL__</p>
  <div class="wordmark">SHIFT</div>
  <div class="tagline">Reprendre le pouvoir d&apos;agir sur sa vie professionnelle.</div>
  <div class="rule"></div>
  <p class="byline"><b>Alexandre Carneado</b> — Coach certifié</p>
  <script>
    // Étiquette de section masquée si vide (rendu Accueil / défaut).
    var eyebrow = document.getElementById("eyebrow");
    if (!eyebrow.textContent || eyebrow.textContent.trim() === "" || eyebrow.textContent === "__LABEL__") {
      eyebrow.style.display = "none";
    }
  </script>
</body>
</html>
